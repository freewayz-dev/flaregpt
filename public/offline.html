<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — FlareGPT</title>
    <!-- Deliberately zero external dependencies — no stylesheet link, no
         script, no font request, and the logo mark is inlined as raw SVG
         rather than an <img src>. This is the one page in the app that has
         to render correctly with literally no network and (in the worst
         case — a fresh install that's never completed a real page load)
         nothing else in any cache either. Anything this page depended on
         fetching could itself be the reason it's needed in the first
         place. -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: #101115;
        color: #fafafa;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 12.5%;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 24px;
      }
      .retry {
        display: inline-block;
        border-radius: 10px;
        background: #e62058;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
      }
      .retry:hover {
        background: #f03a6f;
      }
      @media (prefers-color-scheme: light) {
        html, body { background: #f0f4f9; color: #0f172a; }
        p { color: #475569; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 414 414" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="207.79" y1="-80.52" x2="206.26" y2="475.57" gradientUnits="userSpaceOnUse">
            <stop offset=".01" stop-color="#e62058"/><stop offset=".05" stop-color="#bc1d4a"/>
            <stop offset=".1" stop-color="#8e1a3d"/><stop offset=".14" stop-color="#681731"/>
            <stop offset=".19" stop-color="#481527"/><stop offset=".24" stop-color="#30141f"/>
            <stop offset=".29" stop-color="#1e121a"/><stop offset=".35" stop-color="#141217"/>
            <stop offset=".42" stop-color="#111216"/><stop offset=".53" stop-color="#131216"/>
            <stop offset=".62" stop-color="#1d1219"/><stop offset=".69" stop-color="#2d131e"/>
            <stop offset=".76" stop-color="#431525"/><stop offset=".82" stop-color="#60172e"/>
            <stop offset=".88" stop-color="#831939"/><stop offset=".94" stop-color="#ad1c46"/>
            <stop offset=".99" stop-color="#dd1f55"/><stop offset="1" stop-color="#e62058"/>
          </linearGradient>
        </defs>
        <rect width="414" height="414" rx="51.96" ry="51.96" fill="url(#g)"/>
        <g fill="none" stroke="#e62058" stroke-miterlimit="10" stroke-width="8px">
          <line x1="225.5" y1="178" x2="225.5" y2="199.72"/>
          <line x1="225.5" y1="219.28" x2="225.5" y2="241"/>
          <line x1="257" y1="209.5" x2="235.28" y2="209.5"/>
          <line x1="215.72" y1="209.5" x2="194" y2="209.5"/>
        </g>
        <path fill="#e62058" d="M122,158.74s48,10,48,41-1,149-1,149c0,0-47-9-47-42v-148Z"/>
        <path fill="#e62058" d="M121.89,143.74s10-48,41-48,149,1,149,1c0,0-9,47-42,47h-148Z"/>
      </svg>
      <h1>You're offline</h1>
      <p>FlareGPT needs a connection to load. Reconnect and try again.</p>
      <a class="retry" href="/">Retry</a>
    </div>
  </body>
</html>
