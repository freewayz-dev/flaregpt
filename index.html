<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TEMPORARY — this deployment is currently a team-testing build on a
         Vercel free-tier project, not the real launch. Unlike Vercel's
         *preview* deployments (which get an automatic noindex header),
         the Production deployment's own vercel.app URL gets no such
         protection — if this got indexed under that throwaway URL now, it
         would linger as duplicate content once the real domain launches,
         potentially outranking it early on since it aged in the index
         longer. DELETE this one meta tag (and only this one — nothing
         else below needs to change) the day a real production domain is
         attached and this is meant to actually go live. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- SEO — TODO: this domain is a placeholder (no production domain was
         assigned yet at the time this was written). Every absolute URL
         below (canonical, og:url, og:image, twitter:image) needs updating
         to the real one before launch — grep for "flaregpt.io" across this
         file, robots.txt, and sitemap.xml to find every occurrence.

         This is a client-rendered SPA (see main.jsx — one bundle, one
         index.html served for every route via vercel.json's rewrite), so
         these static tags are what non-JS crawlers (social unfurl bots:
         X, LinkedIn, Slack, Discord) and link-preview tools see — they
         don't execute JS the way Google's crawler does, so they only ever
         get whatever's written here, for every route, not just "/". That's
         fine today: the landing page is the one real public marketing
         surface (the /app dashboard is gated, personalized, and excluded
         from indexing — see robots.txt), so its title/description/OG data
         doubling as the site-wide default costs nothing. -->
    <title>FlareGPT: AI-Powered Dashboard for the Flare Network</title>
    <meta
      name="description"
      content="Track wallets, claim FTSO rewards, monitor governance, and chat with an AI that understands your Flare portfolio. No wallet required to start."
    />
    <link rel="canonical" href="https://flaregpt.io/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flaregpt.io/" />
    <meta property="og:site_name" content="FlareGPT" />
    <meta property="og:title" content="FlareGPT: AI-Powered Dashboard for the Flare Network" />
    <meta
      property="og:description"
      content="Track wallets, claim FTSO rewards, monitor governance, and chat with an AI that understands your Flare portfolio. No wallet required to start."
    />
    <meta property="og:image" content="https://flaregpt.io/og-image.png" />
    <meta property="og:image:width" content="2384" />
    <meta property="og:image:height" content="1355" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlareGPT: AI-Powered Dashboard for the Flare Network" />
    <meta
      name="twitter:description"
      content="Track wallets, claim FTSO rewards, monitor governance, and chat with an AI that understands your Flare portfolio. No wallet required to start."
    />
    <meta name="twitter:image" content="https://flaregpt.io/og-image.png" />

    <meta name="theme-color" content="#E62058" />

    <!-- Organization + WebSite structured data — static and site-wide, so
         it lives here rather than in a component; FAQPage structured data
         (which needs to stay in sync with the actual FAQ content) is
         instead rendered from LandingPage.jsx itself, right next to the
         `faqs` array it mirrors. Google reads JSON-LD injected by JS after
         render just as reliably as static markup, so splitting it this way
         costs nothing for the crawler that actually consumes it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FlareGPT",
        "url": "https://flaregpt.io/",
        "logo": "https://flaregpt.io/og-image.png",
        "description": "AI-powered dashboard for the Flare Network: wallet tracking, FTSO rewards, governance, and an AI assistant that understands your portfolio."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FlareGPT",
        "url": "https://flaregpt.io/"
      }
    </script>

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Plus Jakarta Sans — display face for large headings only; Inter
         above remains the body/UI face everywhere. Served from Google
         Fonts (same host as Inter above) rather than a boutique foundry's
         own CDN, so it isn't a second, less-proven point of failure. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        const root = document.documentElement;
        // Mirrors useUIStore's own onRehydrateStorage decision exactly
        // (same storage key, same hasThemeOverride/system-preference
        // fallback) — this used to read a separate, dead "theme" key that
        // nothing in the app actually wrote to anymore, so this script's
        // one job (apply the right theme before first paint) was being
        // done from stale data: on a dark-system visitor with no saved
        // override, it decided "light" here, then zustand's rehydration
        // moments later decided "dark" from the real data and flipped it —
        // a visible flash on every such load. Reading the real key here
        // means both decisions agree from the start.
        var isDark = false;
        try {
          var raw = localStorage.getItem("flaregpt_ui_preferences");
          var state = raw && JSON.parse(raw).state;
          isDark = state && state.hasThemeOverride
            ? !!state.darkMode
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        if (isDark) root.classList.add("dark");
        else root.classList.remove("dark");

        root.classList.add("no-transition");

        // Removing this only needs the initial paint to have settled, not a
        // full `load` (which waits on every sub-resource — fonts included —
        // finishing). `load` can legitimately never fire: a slow/stalled
        // font request, or the tab being backgrounded/frozen mid-fetch
        // (exactly what happens if a phone gets locked or the browser is
        // switched away from right after opening this page), pauses or
        // cancels that fetch indefinitely. Since `.no-transition *` applies
        // `transition: none !important` to *every element in the document*
        // and `<html>` is never recreated by client-side navigation, a
        // `load` that never fires means every CSS transition in the app —
        // every drawer, modal, and hover state — silently stops animating
        // for the rest of that tab's life, on every page, until a hard
        // reload. `DOMContentLoaded` (or a flat timeout if that's already
        // passed) removes the dependency on external resources entirely,
        // and the outer timeout is an unconditional last-resort fallback so
        // this can never get stuck no matter what does or doesn't fire.
        function clearNoTransition() {
          root.classList.remove("no-transition");
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => setTimeout(clearNoTransition, 50));
        } else {
          setTimeout(clearNoTransition, 50);
        }
        setTimeout(clearNoTransition, 2000);

        // A backgrounded/frozen tab can also come back via the
        // back-forward cache instead of a real reload — the browser
        // restores the exact JS/DOM state it froze, including whatever
        // this class was at the moment it froze, and fires none of the
        // events above again (no DOMContentLoaded, no load). `pageshow`
        // is what *does* fire on a bfcache restore (`event.persisted`
        // is true for it specifically), so this is the one path capable
        // of reviving a stuck class that every other listener here
        // can't reach.
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) clearNoTransition();
        });
      })();
    </script>
  </body>
</html>
