    <!-- Google tag (gtag.js) — GA4 direct, not Google Tag Manager (the
         measurement ID's "G-" prefix is GA4's own format; a GTM container id
         would read "GTM-..." instead). The loader script below is
         necessarily cross-origin (it's Google's own hosted library, no
         same-origin proxy for it), allowed via `script-src` in vercel.json's
         CSP; the config script is same-origin (see gtag-init.js's own
         comment for why) and needs no CSP exception at all. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-Y88004SPTG"
    ></script>
    <script src="/gtag-init.js" defer></script>

    <meta charset="UTF-8" />
    <!-- SVG favicon is what every current browser actually renders in the
         tab; the PNG sizes and apple-touch-icon below are fallbacks for
         the tools that don't render SVG icons at all — notably Google's
         own search-result favicon (documented to want a static raster,
         not SVG) and iOS's home-screen/pinned-tab icon. All four
         (favicon.svg + these three) are generated from the same source —
         see src/assets/icons/flaregpt-mark.svg, the app's real logo mark
         (rendered throughout the app via Logo.tsx and friends) — so the
         favicon, the home-screen icon, and the in-app logo can never drift
         out of sync with each other again. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- `viewport-fit=cover` is what actually lets this app's own
         `env(safe-area-inset-*)` CSS (see Sidebar.jsx, DashboardLayout.jsx,
         Navbar.jsx, ...) resolve to real, non-zero values instead of 0 —
         without it, the page is never told it can extend under the notch/
         Dynamic Island/home-indicator area in the first place, so there's
         nothing for that CSS to inset around. Needed for a true edge-to-
         edge "looks like an installed app" presentation on both iOS and
         Android standalone/PWA mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- iOS Safari never reads display/theme_color/name from the web
         manifest for its own "Add to Home Screen" behavior — these
         Apple-specific tags are the only way to get a real standalone
         launch (no Safari chrome), a themed status bar, and a clean home-
         screen title there. `black-translucent` lets FlareGPT's own dark
         background_color/theme_color show through the status bar area
         instead of Safari drawing a default opaque one over it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FlareGPT" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO — production domain is https://www.flaregpt.io (canonical,
         og:url, og:image, twitter:image, and both JSON-LD blocks below all
         point here). This is a client-rendered SPA (see main.tsx — one
         bundle, one index.html served for every route via vercel.json's
         rewrite), so these static tags are what non-JS crawlers (social
         unfurl bots: X, LinkedIn, Slack, Discord) and link-preview tools
         see — they don't execute JS the way Google's crawler does, so they
         only ever get whatever's written here, for every route, not just
         "/". That's fine today: the landing page is the one real public
         marketing surface (the /app dashboard is gated, personalized, and
         excluded from indexing — see robots.txt), so its
         title/description/OG data doubling as the site-wide default costs
         nothing. -->
    <title>FlareGPT: AI-Powered Dashboard for the Flare Network</title>
    <meta
      name="description"
      content="An AI assistant built for the Flare ecosystem. Live network data, wallets, FTSO rewards, and DeFi tools — no wallet required to start."
    />
    <link rel="canonical" href="https://www.flaregpt.io/" />

         app's own dark surface color (#101115, same as GlobalSpinner and
         the web manifest's background_color), generated from
         src/assets/icons/flaregpt-mark.svg with no new artwork, replacing a
         prior AI-generated dashboard-mockup image. Swap this out for a real
         designed social card later; nothing else here needs to change when
         that happens as long as the replacement keeps the same 1200x630
         dimensions. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.flaregpt.io/" />
    <meta property="og:site_name" content="FlareGPT" />
    <meta

    <!-- Kept in sync with the app's own resolved light/dark surface color
         at runtime (see public/theme-init.js and useUIStore.ts's
         setAppearance) rather than left as a fixed brand color — a native
         app's status bar/task-switcher chrome blends into its current
         background, it doesn't stay tinted brand-pink regardless of
         theme. This static value (matching the manifest's own
         background_color) is only what a crawler or the very first
         instant before theme-init.js runs ever sees. -->
    <meta name="theme-color" content="#101115" />

    <!-- Same-origin external file, not inline — moved out specifically so
         the Content-Security-Policy's `script-src` can be `'self'` alone,
         with no `'unsafe-inline'` and no hash pinned against this script's
         exact formatting (see public/theme-init.js's own comment for why).
         Loaded without async/defer, so it still runs synchronously at this
         exact point in the document.
         Lives in the document head, right after the meta tag above (its
         own dependency — it reads that tag back out) — not at the very
         end of the document, where it used to sit: this page's own root
         element is prerendered with real, already-styled markup (see
         prerender.js), not an empty div waiting for React, so on any
         connection where the HTML streams in rather than arriving in one
         instant chunk (the normal case on a real mobile network), a
         script positioned after all of that content had a real window to
         let the browser paint it in light mode's default colors before
         ever reaching this script and adding the dark-mode class. Moving
         the same script earlier, unchanged, closes that window instead of
         opening a new one.
         Note for future edits: prerender.js locates the document head and
         body by searching this file's raw text for the literal tag
         strings, not by parsing it — a comment anywhere in the head that
         happens to spell out the body tag (or vice versa) is enough to
         make that search match itself instead of the real element. Kept
         out of this comment on purpose; keep it out of future ones here
         too. -->
    <script src="/theme-init.js"></script>

    <!-- Organization + WebSite structured data — static and site-wide, so
         it lives here rather than in a component; FAQPage structured data
         (which needs to stay in sync with the actual FAQ content) is
         instead rendered from LandingPage.tsx itself, right next to the
         `faqs` array it mirrors. Google reads JSON-LD injected by JS after
         render just as reliably as static markup, so splitting it this way
         costs nothing for the crawler that actually consumes it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FlareGPT",
        "url": "https://www.flaregpt.io/",
        "logo": "https://www.flaregpt.io/apple-touch-icon.png",
        "description": "AI-powered dashboard for the Flare Network: wallet tracking, FTSO rewards, governance, and an AI assistant that understands your portfolio."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FlareGPT",
        "url": "https://www.flaregpt.io/"
      }
    </script>
    <!-- SoftwareApplication — separate from Organization/WebSite above:
         this is what tells Google (and AI answer engines pulling from the
         same structured data) that FlareGPT is a specific piece of
         software with a category and a real price, not just "a website."
         `offers.price: 0` matters here — the whole product is free to use
         without a wallet (see the landing page's own copy), and an
         explicit free-price offer is what qualifies this for Google's
         price/availability rich-result treatment instead of leaving that
         ambiguous. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FlareGPT",
        "url": "https://www.flaregpt.io/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "An AI assistant built for the Flare ecosystem. Live network data, wallets, FTSO rewards, and DeFi tools — no wallet required to start.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "sameAs": ["https://x.com/Flare_GPT"]
      }
    </script>

    <!-- Inter (body/UI face) + Plus Jakarta Sans (display face for large
         headings only) are self-hosted — see src/fonts.css, imported from

         (400/500/600/700/900 for Inter, 600/700 for Plus Jakarta Sans,

         src/), same glyph coverage, same font-display: swap; the only
         change is removing the extra render-blocking cross-origin round
         trip a <link rel="stylesheet"> to fonts.googleapis.com forced
         before first paint. -->
  </head>
  <body>
    <div id="root"></div>

    <!-- This is a client-rendered SPA (see the comment on the SEO block
         in <head>) — #root above is empty until React mounts, which means
         any crawler that fetches this HTML without executing JavaScript
         sees no actual page content at all, just the <head> tags. Google
         and Bing's crawlers do execute JS reliably today, but most of the
         crawlers behind AI answer engines and LLM training corpora
         (GPTBot, ClaudeBot/anthropic-ai, PerplexityBot, CCBot) are
         confirmed NOT to — see robots.txt, which explicitly welcomes all
         of them. A <noscript> block is the one place static, real prose
         can reach those crawlers without a full prerendering/SSR pipeline
         (tracked separately — see Phase 2 notes); this is a stopgap, not
         a replacement for that, but it costs nothing and closes most of
         the gap for exactly the audience Google's own crawler doesn't
         need this for. -->
    <noscript>

        style="
          max-width: 640px;
          margin: 0 auto;
          padding: 48px 24px;
          font-family: -apple-system, sans-serif;
          color: #0f172a;

        <ul>

          <li>Claim and monitor FTSO delegation rewards.</li>
          <li>Follow Flare Network governance proposals.</li>
          <li>Explore DeFi protocols and yield strategies built on Flare.</li>

            Ask FlareGPT, an AI assistant with direct knowledge of your

        </ul>
        <p>
          Enable JavaScript to use the full interactive dashboard at
          www.flaregpt.io.
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
